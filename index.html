<!DOCTYPE html>
<!-- =====================================================================
     GMAT 750+ Trainer — v1.6.0
     Self-contained GMAT Focus Edition prep app (100% client-side).
     Hosted live at https://jadax.github.io/GMATTrainer/
     ===================================================================== -->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="GMAT 750+ Trainer - Comprehensive GMAT Focus Edition prep with Learn, Practice, Simulator, Analytics and Progress tracking. 100% local, no external accounts." />
  <title>GMAT 750+ Trainer</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Open+Sans:wght@400;600&family=Source+Serif+4:wght@400;600;700&display=swap" rel="stylesheet" />

  <!-- Theme/stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===================== HEADER ===================== -->
  <header class="site-header" id="siteHeader">
    <div class="header-inner">
      <a class="brand" href="#/dashboard" aria-label="GMAT 750+ Trainer Home">
        <span class="brand-mark">🎯</span>
        <span class="brand-text">GMAT <span class="brand-highlight">750+</span> Trainer</span>
      </a>

      <nav class="main-nav" id="mainNav" aria-label="Main navigation">
        <a class="nav-link" data-route="dashboard" href="#/dashboard">Dashboard</a>
        <a class="nav-link" data-route="learn" href="#/learn">Learn</a>
        <a class="nav-link" data-route="practice" href="#/practice">Practice</a>
        <a class="nav-link" data-route="diagnostic" href="#/diagnostic">Diagnostic</a>
        <a class="nav-link" data-route="simulator" href="#/simulator">Simulator</a>
        <a class="nav-link" data-route="analytics" href="#/analytics">Analytics</a>
        <a class="nav-link" data-route="advisor" href="#/advisor">Advisor</a>
        <a class="nav-link" data-route="bank" href="#/bank">Bank</a>
        <a class="nav-link" data-route="progress" href="#/progress">Progress</a>
      </nav>

      <div class="header-stats" id="headerStats"></div>

      <button class="theme-toggle" id="themeToggle" aria-label="Toggle dark/light theme" title="Toggle theme">
        <span class="theme-icon" aria-hidden="true">🌙</span>
      </button>

      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </header>

  <!-- ===================== MAIN CONTENT ===================== -->
  <main class="main-content" id="mainContent" tabindex="-1">
    <div id="app" class="app-view">
      <div class="loading-screen" id="loadingScreen">
        <div class="spinner" aria-hidden="true"></div>
        <p>Loading GMAT 750+ Trainer...</p>
      </div>
    </div>
  </main>

  <!-- ===================== TOAST NOTIFICATIONS ===================== -->
  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <!-- ===================== MODAL ROOT ===================== -->
  <div id="modalRoot"></div>

  <!-- ===================== SCRIPTS ===================== -->
  <!-- Core data layers -->
  <script src="js/data/questions.js"></script>
  <script src="js/data/curriculum.js"></script>
  <script src="js/data/gamification.js"></script>
  <!-- Core engine -->
  <script src="js/core.js"></script>
  <!-- Router & Views -->
  <script src="js/router.js"></script>
  <script src="js/views/di-formats.js"></script>
  <script src="js/views/dashboard.js"></script>
  <script src="js/views/learn.js"></script>
  <script src="js/views/practice.js"></script>
  <script src="js/views/diagnostic.js"></script>
  <script src="js/views/simulator.js"></script>
  <script src="js/views/analytics.js"></script>
  <script src="js/views/progress.js"></script>
  <script src="js/views/planner.js"></script>
  <script src="js/views/flashcards.js"></script>
  <script src="js/views/advisor.js"></script>
  <script src="js/views/bank.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
